<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>orbita-launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;800&display=block" rel="stylesheet">
<script src="/__engine/gsap.min.js"></script>
<script src="/__engine/stage.js"></script>
<style>
  :root { --bg: #0d0e12; --ink: #f2f0ea; --accent: #c6ff3d; --dim: #6c6e74; --block: #23262f; }
  #stage { font-family: 'Inter Tight', sans-serif; color: var(--ink); }
  #grid { position: absolute; inset: 0; }
  .copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 640px; display: flex; align-items: center; }
  .shot { position: absolute; left: 0; width: 640px; opacity: 0; }
  .word { font-weight: 800; font-size: 128px; letter-spacing: -0.045em; line-height: .92; }
  .word .a { color: var(--accent); }
  .mask { overflow: hidden; padding-bottom: .08em; }
  .mask > span { display: inline-block; }
  #cal { position: absolute; left: 760px; top: 130px; width: 1100px; height: 860px; transform-origin: 50% 40%; }
  .day { position: absolute; top: -10px; width: 200px; font-weight: 600; font-size: 40px; color: var(--dim); opacity: 0; }
  .blk { position: absolute; width: 206px; border-radius: 16px; background: var(--block); border-left: 9px solid var(--c); padding: 14px 16px; box-sizing: border-box; font-weight: 600; font-size: 34px; color: #c9c7c0; }
  .blk.focus { background: var(--accent); color: #11130d; border-left-color: #11130d; }
  #logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 44px; opacity: 0; }
  #logo .name { font-weight: 800; font-size: 210px; letter-spacing: -0.05em; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; opacity: 0; }
  #end .claim { font-weight: 800; font-size: 104px; letter-spacing: -0.04em; }
  #end .url { font-weight: 500; font-size: 52px; color: var(--dim); }
  #end .mini { display: flex; align-items: center; gap: 22px; font-weight: 800; font-size: 64px; letter-spacing: -0.04em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="grid" width="1920" height="1080"></canvas>
  <div class="copy">
    <div class="shot" id="s1"><div class="word mask"><span>Reuniones.</span></div></div>
    <div class="shot" id="s2"><div class="word mask"><span>Pendientes.</span></div></div>
    <div class="shot" id="s3"><div class="word mask"><span>Todo a</span></div><div class="word mask"><span>la vez.</span></div></div>
    <div class="shot" id="s5"><div class="word mask"><span>Tu semana</span></div><div class="word mask"><span>se ordena</span></div><div class="word mask"><span class="a">sola.</span></div></div>
  </div>
  <div id="cal"></div>
  <div id="logo"><svg width="190" height="190" viewBox="-95 -95 190 190"><circle r="78" fill="none" stroke="#f2f0ea" stroke-width="12"/><circle id="moon" r="20" fill="#c6ff3d" cx="78" cy="0"/></svg><div class="name">Órbita</div></div>
  <div id="end">
    <div class="mini"><svg width="78" height="78" viewBox="-39 -39 78 78"><circle r="31" fill="none" stroke="#f2f0ea" stroke-width="6"/><circle id="moon2" r="9" fill="#c6ff3d" cx="31" cy="0"/></svg>Órbita</div>
    <div class="claim">Tu semana, en orden.</div>
    <div class="url">orbita.app</div>
  </div>
</div>
<script>
  const BPM = 120;
  const beatLen = 60 / BPM, barLen = beatLen * 4;
  const stage = Stage.create({
    width: 1920, height: 1080, fps: 30, seed: 'orbita', background: '#0d0e12',
    bpm: BPM, duration: barLen * 8 + 1.5,
    music: { style: 'hype', key: 'F', energy: [[0, 1], [barLen, 2], [barLen * 3, 3], [barLen * 6, 2]], drops: [{ at: barLen * 3 - beatLen, dur: beatLen }], end: barLen * 8 },
  });
  const { tl, rand, bar, beat } = stage;

  // ---- Calendario: bloques con posición de caos y posición en la semana ---------------------
  const DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie'];
  const COLORS = ['#7aa2ff', '#ff8a5b', '#b48cff', '#5fd3b0', '#ffd25a'];
  const LABELS = ['Reunión', '1:1', 'Correo', 'Revisión', 'Llamada', 'Diseño', 'Planear', 'Equipo', 'Cliente', 'Informe', 'Sync', 'Demo', 'Pagos', 'Retro'];
  const SLOT = 86, COLW = 216, TOP = 60;
  const cal = document.getElementById('cal');
  DAYS.forEach((d, i) => { const el = document.createElement('div'); el.className = 'day'; el.dataset.qaIgnore = ''; el.textContent = d; el.style.left = i * COLW + 'px'; cal.appendChild(el); });
  // Disposición final: [día, hora inicial (slot), duración en slots]
  const PLAN = [[0,0,2],[0,3,1],[0,5,2],[1,0,1],[1,2,3],[1,6,2],[2,1,2],[2,4,1],[3,0,2],[3,3,2],[3,6,1],[4,0,1],[4,2,2],[4,5,2]];
  const FOCUS = [2, 5, 3];   // el hueco que Órbita libera: "Pensar"
  const blocks = [...PLAN.map((p, i) => ({ p, label: LABELS[i], color: COLORS[i % COLORS.length] })), { p: FOCUS, label: 'Pensar', focus: true }];
  blocks.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'blk' + (b.focus ? ' focus' : '');
    el.dataset.qaIgnore = '';
    el.textContent = b.label;
    el.style.setProperty('--c', b.color || '#11130d');
    el.style.height = b.p[2] * SLOT - 10 + 'px';
    el.style.left = b.p[0] * COLW + 'px';
    el.style.top = TOP + b.p[1] * SLOT + 'px';
    el.style.opacity = 0;
    cal.appendChild(el);
    b.el = el;
    // caos: amontonados, girados, encimados
    b.chaos = { x: rand.range(0, 200) - b.p[0] * COLW * 0.45, y: rand.range(-60, 360) - b.p[1] * SLOT * 0.5, rotation: rand.range(-24, 24) };
    b.s = { fall: 0, land: 0 };   // dos progresos independientes: caer al caos y aterrizar en la semana
  });

  // ---- Fondo: rejilla de puntos que late en cada tiempo -------------------------------------
  const g = document.getElementById('grid').getContext('2d');
  const shake = { v: 0 }, hidden = { v: 0 };
  stage.onFrame((t) => {
    g.clearRect(0, 0, 1920, 1080);
    const phase = (t / beatLen) % 1, pulse = Math.exp(-phase * 6);
    const off = (t * 18) % 60;
    g.fillStyle = `rgba(242,240,234,${0.05 + 0.05 * pulse})`;
    for (let x = -60; x < 1980; x += 60) for (let y = -60; y < 1140; y += 60) g.fillRect(x - off, y + off * 0.3, 3, 3);
    // órbita del logo
    const a = t * 2.2;
    for (const [id, r] of [['moon', 78], ['moon2', 31]]) { const m = document.getElementById(id); m.setAttribute('cx', Math.cos(a) * r); m.setAttribute('cy', Math.sin(a) * r); }
    // temblor del caos (función cerrada del tiempo, sin estado)
    // posición de cada bloque: función de sus dos progresos (deterministas) + temblor
    blocks.forEach((b, i) => {
      if (b.focus) return;
      const { fall, land } = b.s, c = b.chaos;
      const cx = c.x, cy = -900 + (c.y + 900) * fall;
      const x = cx * (1 - land), y = cy * (1 - land), r = c.rotation * (1 - land) * (0.5 + 0.5 * fall) + c.rotation * (1 - fall);
      const sx = Stage.noise('sx' + i, t * 9) * 14 * shake.v, sy = Stage.noise('sy' + i, t * 9) * 14 * shake.v;
      b.el.style.transform = `translate(${x + sx}px, ${y + sy}px) rotate(${r}deg)`;
      b.el.style.opacity = fall > 0 && !hidden.v ? 1 : 0;
    });
  });

  const show = (sel, a, b) => tl.set(sel, { opacity: 1 }, a).set(sel, { opacity: 0 }, b);
  const rise = (sel, at) => tl.fromTo(`${sel} .mask > span`, { yPercent: 108 }, { yPercent: 0, duration: 0.42, ease: 'power4.out', stagger: 0.06 }, at);
  const leave = (sel, at) => tl.to(`${sel} .mask > span`, { yPercent: -108, duration: 0.28, ease: 'power4.in', stagger: 0.03 }, at);

  // Compás 1–2: llegan reuniones y pendientes, caen al calendario encimados.
  show('#s1', 0, bar(1)); rise('#s1', 0); leave('#s1', bar(1) - 0.3);
  show('#s2', bar(1), bar(2)); rise('#s2', bar(1)); leave('#s2', bar(2) - 0.3);
  const chaosBlocks = blocks.filter((b) => !b.focus);
  chaosBlocks.forEach((b, i) => {
    const at = (i < 7 ? 0.1 : bar(1)) + (i % 7) * (beatLen / 2);
    tl.fromTo(b.s, { fall: 0 }, { fall: 1, duration: 0.45, ease: 'power4.out' }, at);
    if (i % 2 === 0) stage.sfx('thud', at + 0.12, -20);
  });

  // Compás 3: todo tiembla cada vez más; un tiempo antes del compás 4, silencio y negro.
  show('#s3', bar(2), bar(3) - beat(1)); rise('#s3', bar(2));
  tl.fromTo(shake, { v: 0 }, { v: 1, duration: barLen - beatLen, ease: 'power2.in' }, bar(2))
    .set(shake, { v: 0 }, bar(3) - beat(1))
    .set(hidden, { v: 1 }, bar(3) - beat(1)).set(hidden, { v: 0 }, bar(5));
  stage.sfx('riser', bar(3) - beat(1) - 2, -16);

  // Compás 4–5: el nombre llega en el golpe desde grande.
  show('#logo', bar(3), bar(5) - 0.3);
  tl.fromTo('#logo', { scale: 1.8 }, { scale: 1, duration: 0.55, ease: 'expo.out' }, bar(3))
    .to('#logo', { scale: 0.94, duration: barLen * 2 - 0.85, ease: 'none' }, bar(3) + 0.55)
    .to('#logo', { y: -60, opacity: 0, duration: 0.3, ease: 'power4.in' }, bar(5) - 0.3);
  stage.sfx('impact', bar(3), -8);

  // Compás 6–7: los bloques vuelven y aterrizan en su lugar de la semana, uno por corchea.
  show('#s5', bar(5), bar(7) + beat(2)); rise('#s5', bar(5));
  tl.to('.day', { opacity: 1, duration: 0.3, stagger: 0.05 }, bar(5))
    .fromTo('#cal', { scale: 0.96 }, { scale: 1.03, duration: barLen * 2.6, ease: 'none' }, bar(5));
  chaosBlocks.forEach((b, i) => {
    const at = bar(5) + 0.2 + i * (beatLen / 2);
    tl.fromTo(b.s, { land: 0 }, { land: 1, duration: 0.38, ease: 'power4.out' }, at);
    stage.sfx('tick', at + 0.1, -17);
  });
  // El hueco liberado se enciende: tiempo para pensar.
  const focus = blocks.find((b) => b.focus);
  tl.fromTo(focus.el, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'expo.out' }, bar(7));
  stage.sfx('chime', bar(7), -10);
  leave('#s5', bar(7) + beat(2) - 0.3);
  tl.to('#cal', { opacity: 0, x: -80, duration: 0.3, ease: 'power4.in' }, bar(8) - beat(0.4) - 0.32);

  // Cierre: claim + dirección, sostenido.
  show('#end', bar(8) - beat(0.4), stage.duration);
  tl.fromTo('#end .mini', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power4.out' }, bar(8) - beat(0.4))
    .fromTo('#end .claim', { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power4.out' }, bar(8) - beat(0.2))
    .fromTo('#end .url', { opacity: 0 }, { opacity: 1, duration: 0.3 }, bar(8) + beat(1));
  stage.sfx('whoosh', bar(1) - 0.15, -18).sfx('whoosh', bar(2) - 0.15, -18).sfx('whoosh', bar(5) - 0.15, -16).sfx('pop', bar(8) - beat(0.4), -14);
</script>
</body>
</html>
