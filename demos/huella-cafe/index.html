<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>huella-cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&display=block" rel="stylesheet">
<script src="/__engine/gsap.min.js"></script>
<script src="/__engine/stage.js"></script>
<style>
  :root { --paper: #f4f2ec; --ink: #1d1a24; --water: #2a6fdb; --water2: #a9c4ef; --coffee: #6b4a35; --muted: #77716a; }
  #stage { font-family: 'Archivo', sans-serif; color: var(--ink); }
  #bg { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .num { position: absolute; left: 84px; top: 210px; font-weight: 800; font-size: 250px; line-height: .8; letter-spacing: -0.05em; color: var(--water); font-variant-numeric: tabular-nums; }
  .num small { font-size: 120px; letter-spacing: -0.03em; margin-left: 14px; }
  .unit { position: absolute; left: 92px; top: 440px; font-weight: 600; font-size: 64px; color: var(--muted); }
  .cup { position: absolute; left: 640px; top: 520px; }
  .bar { position: absolute; left: 92px; top: 200px; width: 230px; height: 700px; border-radius: 18px; background: #e6e2d8; overflow: hidden; }
  .bar .farm { position: absolute; left: 0; right: 0; bottom: 10px; height: 690px; background: var(--water); transform-origin: 50% 100%; }
  .bar .brew { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--coffee); }
  .tag { position: absolute; left: 370px; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.02em; }
  .tag span { display: block; font-weight: 500; font-size: 50px; color: var(--muted); letter-spacing: 0; margin-top: 10px; }
  #bottles { position: absolute; left: 84px; top: 190px; }
  .count { position: absolute; left: 84px; top: 850px; font-weight: 800; font-size: 92px; letter-spacing: -0.03em; color: var(--water); font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); font-weight: 500; font-size: 56px; letter-spacing: 0; }
  .big { position: absolute; left: 84px; right: 120px; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -0.035em; }
  .big em { font-style: normal; color: var(--water); }
  .src { position: absolute; left: 84px; top: 960px; font-weight: 500; font-size: 48px; color: var(--muted); }
  .cap { position: absolute; left: 84px; right: 120px; top: 985px; font-weight: 800; font-size: 66px; line-height: 1.08; }
  .cap .cw { opacity: .28; }
  .cap .cw.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1350"></canvas>

  <!-- 1 · gancho: la taza y el contador -->
  <div class="scene" id="s1">
    <div class="num"><b id="n1">0</b><small>L</small></div>
    <div class="unit">de agua, por una taza</div>
    <svg class="cup" width="340" height="340" viewBox="0 0 340 340">
      <g id="steam" fill="none" stroke="#b9b2a6" stroke-width="10" stroke-linecap="round">
        <path id="st1" d="M120 70 C 100 40, 140 20, 120 -10"/><path id="st2" d="M170 70 C 150 40, 190 20, 170 -10"/><path id="st3" d="M220 70 C 200 40, 240 20, 220 -10"/>
      </g>
      <ellipse cx="170" cy="300" rx="150" ry="26" fill="#e3ddd1"/>
      <path d="M60 110 H280 V200 C280 262 236 290 170 290 C104 290 60 262 60 200 Z" fill="#1d1a24"/>
      <path d="M280 140 C330 140 330 220 274 222" fill="none" stroke="#1d1a24" stroke-width="18"/>
      <ellipse cx="170" cy="112" rx="110" ry="16" fill="#6b4a35"/>
    </svg>
  </div>

  <!-- 2–3 · dónde está el agua: barra apilada -->
  <div class="scene" id="s2">
    <div class="bar"><div class="farm"></div><div class="brew"></div></div>
    <div class="tag" id="tagBrew" style="top:800px">En la taza<span>casi nada</span></div>
    <div class="tag" id="tagFarm" style="top:250px; color: var(--water)">En la finca<span>cultivar los granos</span></div>
  </div>

  <!-- 4 · escala: 140 botellas -->
  <div class="scene" id="s4">
    <svg id="bottles" width="912" height="640"></svg>
    <div class="count"><b id="n4">0</b> <span>botellas de 1 litro</span></div>
  </div>

  <!-- 5 · remate -->
  <div class="scene" id="s5">
    <div class="big" id="p1" style="top:330px">No se trata de dejar el café.</div>
    <div class="big" id="p2" style="top:600px">Se trata de saber <em>cuánto vale.</em></div>
    <div class="src">Fuente: Water Footprint Network</div>
  </div>
</div>
<script>
  const W = 1080, H = 1350;
  const stage = Stage.create({
    width: W, height: H, fps: 30, seed: 'huella-cafe', background: '#f4f2ec',
    voice: 'voice.json', duration: 'voice',
    bpm: 80,
    music: { style: 'ambient', key: 'Eb', drops: [{ at: 16.75, dur: 0.55 }] },   // silencio entre "taza" y el remate
  });
  const { tl, rand } = stage;
  Stage.captions(stage, { maxWords: 3, skip: ['payoff'] });

  // Fondo: gotas muy tenues que caen lento (vida sin protagonismo).
  const g = document.getElementById('bg').getContext('2d');
  const drops = Array.from({ length: 22 }, (_, i) => ({ x: rand.range(40, 1040), y: rand.range(0, 1350), sp: rand.range(14, 34), r: rand.range(5, 10) }));
  stage.onFrame((t) => {
    g.fillStyle = '#f4f2ec'; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(42,111,219,0.07)';
    for (const d of drops) {
      const y = (d.y + t * d.sp) % (H + 40) - 20;
      g.beginPath(); g.moveTo(d.x, y - d.r * 1.8); g.quadraticCurveTo(d.x + d.r, y, d.x, y + d.r); g.quadraticCurveTo(d.x - d.r, y, d.x, y - d.r * 1.8); g.fill();
    }
    // vapor de la taza: ondula como función del tiempo
    for (let k = 1; k <= 3; k++) {
      const el = document.getElementById('st' + k);
      el.style.transform = `translate(${Stage.noise('st' + k, t * 0.8) * 10}px, ${-((t * 18 + k * 9) % 22)}px)`;
      el.style.opacity = 0.5 + 0.5 * Math.sin(t * 2 + k);
    }
  });

  const show = (sel, a, b) => tl.set(sel, { opacity: 1 }, a).set(sel, { opacity: 0 }, b);
  const counter = (el, to, from, at, dur, ease = 'power2.out') => {
    const o = { v: from };
    tl.fromTo(o, { v: from }, { v: to, duration: dur, ease, onUpdate: () => { document.getElementById(el).textContent = Math.round(o.v).toLocaleString('es'); } }, at);
  };

  // 1 · Gancho: el contador sube y aterriza en "litros"; la taza entra ya en movimiento.
  show('#s1', 0, stage.end('hook', 0.35));
  tl.fromTo('#s1 .num', { y: 60, opacity: 0.3 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power4.out' }, 0)
    .fromTo('.cup', { x: 120, opacity: 0.3 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power4.out' }, 0.1)
    .fromTo('#s1 .unit', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, stage.word('hook', 'agua', -0.1))
    .to('#s1', { x: -220, opacity: 0, duration: 0.3, ease: 'power4.in' }, stage.end('hook', 0.05));
  counter('n1', 140, 0, 0.3, stage.word('hook', 'litros') - 0.3);
  stage.sfx('tick', stage.word('hook', 'litros'), -12);

  // 2 · Casi nada en la taza: la barra aparece vacía y solo se marca una franja café abajo.
  const a2 = stage.at('brew');
  show('#s2', a2 - 0.2, stage.end('farm', 0.4));
  tl.set('.bar .farm', { scaleY: 0 }, 0);
  tl.fromTo('.bar', { x: 200, opacity: 0.3 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power4.out' }, a2 - 0.2)
    .fromTo('#tagBrew', { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, a2)
    .fromTo('.bar .brew', { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power3.out' }, stage.word('brew', 'nada', -0.1));
  stage.sfx('swish', a2 - 0.2, -16).sfx('pop', stage.word('brew', 'nada'), -14);

  // 3 · La finca: la barra se llena de agua hasta arriba durante "cultivar los granos".
  tl.to('.bar .farm', { scaleY: 1, duration: stage.word('farm', 'granos') - stage.at('farm') + 0.2, ease: 'power2.inOut' }, stage.at('farm'))
    .fromTo('#tagFarm', { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, stage.word('farm', 'cultivar', -0.2))
    .to('#s2', { x: -220, opacity: 0, duration: 0.3, ease: 'power4.in' }, stage.end('farm', 0.1));
  stage.sfx('riser', stage.word('farm', 'granos', 0.2) - 2, -22).sfx('thud', stage.word('farm', 'granos', 0.2), -13);

  // 4 · Escala: 140 botellas de 1 L se llenan fila por fila, al ritmo de la frase.
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('bottles');
  const COLS = 14, CW = 65, RH = 64;
  const bottles = [];
  for (let i = 0; i < 140; i++) {
    const x = (i % COLS) * CW, y = Math.floor(i / COLS) * RH;
    const gEl = document.createElementNS(NS, 'g');
    gEl.setAttribute('transform', `translate(${x + 8},${y})`);
    gEl.innerHTML = `<rect x="14" y="0" width="18" height="10" rx="3" fill="#1d1a24"/><rect x="4" y="10" width="38" height="46" rx="10" fill="#2a6fdb"/>`;
    gEl.style.opacity = 0.12;
    svg.appendChild(gEl);
    bottles.push(gEl);
  }
  const a4 = stage.at('scale');
  show('#s4', stage.end('farm', 0.42), stage.end('scale', 0.45));
  const fill = { n: 0 };
  tl.fromTo(fill, { n: 0 }, { n: 140, duration: stage.word('scale', 'cada') - a4, ease: 'power1.in',
    onUpdate: () => { const k = Math.round(fill.n); bottles.forEach((b, i) => (b.style.opacity = i < k ? 1 : 0.12)); document.getElementById('n4').textContent = k; } }, a4)
    .fromTo('#s4 .count', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, a4)
    .to('#s4', { y: -120, opacity: 0, duration: 0.3, ease: 'power4.in' }, stage.end('scale', 0.15));
  stage.sfx('bubble', a4 + 0.2, -16).sfx('bubble', a4 + 1.2, -16).sfx('bubble', a4 + 2.2, -16).sfx('ding', stage.word('scale', 'taza'), -12);

  // 5 · Remate tras el silencio: dos frases; "cuánto vale" se enciende al decirse.
  const a5 = stage.at('payoff');
  show('#s5', a5 - 0.1, stage.duration);
  tl.fromTo('#p1', { y: 70, opacity: 0.3 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power4.out' }, a5 - 0.1)
    .fromTo('#p2', { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power4.out' }, stage.line('payoff').words[7].start - 0.1)   // "Se trata de saber…"
    .fromTo('#p2 em', { color: '#1d1a24' }, { color: '#2a6fdb', duration: 0.15 }, stage.word('payoff', 'cuánto', -0.05))
    .fromTo('#p1', { opacity: 1 }, { opacity: 0.35, duration: 0.4 }, stage.line('payoff').words[7].start)
    .fromTo('.src', { opacity: 0 }, { opacity: 1, duration: 0.4 }, stage.end('payoff', 0.3))
    .to(['#p1', '#p2'], { y: -14, duration: stage.duration - a5 - 0.5, ease: 'none' }, a5 + 0.4);
  stage.sfx('impact', stage.word('payoff', 'cuánto'), -12);
</script>
</body>
</html>
