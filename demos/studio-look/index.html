<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>studio-look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #05070b; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b1018; }
  .grain { position: absolute; inset: 0; pointer-events: none; }

  /* Tipografía: una sola familia display, baseline fija, alineada a la izquierda del margen. */
  .kicker {
    position: absolute; left: 96px; top: 292px;
    font: 500 48px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase;
    color: #f0d9b5; opacity: 0;
  }
  .head {
    position: absolute; left: 92px; top: 392px; width: 720px;
    font: 800 104px/0.96 'Archivo', sans-serif; letter-spacing: -0.025em; color: #f7f3ea;
    opacity: 0;
  }
  .head em { font-style: normal; color: #ff6a4d; }
  .sub {
    position: absolute; left: 96px; top: 1128px; width: 700px;
    font: 400 48px/1.24 'Archivo', sans-serif; color: #e9edf3; opacity: 0;
  }
  .scrim {
    position: absolute; left: 0; top: 1010px; width: 900px; height: 560px;
    background: linear-gradient(96deg, rgba(5,8,13,.76) 0%, rgba(5,8,13,.62) 38%, rgba(5,8,13,.28) 66%, rgba(5,8,13,0) 88%);
    pointer-events: none;
  }
  .foot {
    position: absolute; left: 96px; top: 1424px;
    font: 500 44px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; color: #a8b3c4; opacity: 0;
  }
  .rule { position: absolute; left: 96px; top: 1096px; width: 0; height: 3px; background: #ff6a4d; opacity: .9; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="set"></canvas>
  <div class="scrim"></div>
  <div class="rule" id="rule"></div>
  <div class="kicker" id="kicker">medido, no opinado</div>
  <h1 class="head" id="head">Un video<br>no se mira.<br><em>Se mide.</em></h1>
  <p class="sub" id="sub">El motor mide cada fotograma antes de entregarlo: quietud, cadencia, loudness y legibilidad.</p>
  <div class="foot" id="foot">creative engine</div>
</div>

<script src="/__engine/gsap.min.js"></script>
<script src="/__engine/stage.js"></script>
<script src="/__engine/kits/studio.js"></script>
<script>
  const stage = Stage.create({
    width: 1080, height: 1920, fps: 30, seed: 'studio-look',
    background: '#0b1018', duration: 12, bpm: 84,
    music: { style: 'ambient' },
    profile: 'social',
  });
  const { tl } = stage;

  const set = Studio.create(stage, { canvas: 'set' });
  set.scene({
    background: ['#0a0f18', '#22304a'],
    fog: 0.07,
    fogColor: '#1a2438',
    floor: { color: '#0b0f16', rough: 0.58, y: 0 },
    light: {
      key: { dir: [-0.55, 0.95, 0.35], color: '#fff0d8', power: 1.32 },
      fill: { color: '#78a5ff', power: 0.3 },
      rim: { color: '#ffd2a1', power: 0.58 },
    },
    screenColor: '#4f9dff',
    post: { grain: 0.042, vignette: 0.36, exposure: 1.04, dither: true, seed: 11 },
    objects: [
      // pedestal de arcilla: el objeto que da escala y recibe la sombra de contacto
      { kind: 'slab', pos: [0.62, 0.09, 0], size: [0.92, 0.18, 0.66], radius: 0.045, color: '#efe6d8', rough: 0.55 },
      // teléfono apoyado, pantalla prendida (el único blanco que quema)
      { kind: 'phone', pos: [0.55, 0.36, 0.04], size: [0.26, 0.54, 0.04], radius: 0.028,
        color: '#0b0e14', rough: 0.24, yaw: 0.32, pitch: -0.03, screen: { glow: 0.06, w: 0.74, h: 0.8 } },
      // tarjeta flotando: el gesto de diseño que da aire, separada del pedestal
      { kind: 'card', pos: [0.99, 0.35, 0.22], size: [0.32, 0.19, 0.01], radius: 0.014,
        color: '#f7f2e8', rough: 0.6, yaw: -0.62, pitch: -0.26 },
      // acento: una esfera del color de marca, chica, para dirigir el ojo
      { kind: 'sphere', pos: [0.84, 0.6, 0.1], size: [0.07, 0.07, 0.07], color: '#ff6a4d', rough: 0.34 },
    ],
  });
  set.camera({ pos: [0.42, 0.78, 5.6], target: [0.42, 0.56, 0], fov: 1.75, roll: -0.012 });

  // Cámara continua: nunca se apaga, y el recorrido es la única cosa en vuelo al principio.
  tl.fromTo({ z: 5.6 }, { z: 5.6 }, { z: 5.05, duration: 12, ease: 'power1.inOut' }, 0);
  tl.fromTo({ y: 0.78, x: 0.42 }, { y: 0.78, x: 0.42 }, { y: 0.86, x: 0.36, duration: 12, ease: 'power1.inOut' }, 0);
  tl.fromTo({ r: -0.012 }, { r: -0.012 }, { r: 0.014, duration: 12, ease: 'none' }, 0);
  const cam = { z: 5.6, x: 0.42, y: 0.78, r: -0.012 };
  tl.to(cam, { z: 4.62, x: 0.3, y: 0.9, r: 0.02, duration: 12, ease: 'power1.inOut' }, 0);

  // La tarjeta respira 2 grados, la esfera no se mueve: una sola cosa en vuelo además de la cámara.
  tl.fromTo({ v: 0 }, { v: 0 }, { v: 1, duration: 12, ease: 'none' }, 0);

  // La pantalla despierta: el único cambio de estado del set, con su golpe de sonido y su escalón de cámara.
  const wake = { v: 0 };
  tl.fromTo(wake, { v: 0 }, { v: 1, duration: 0.5, ease: 'power2.out' }, 6.2);
  stage.sfx('ding', 6.28, -19);
  stage.sfx('thud', 6.2, -26);

  stage.onFrame((t) => {
    set.camera({ pos: [cam.x, cam.y, cam.z], target: [0.42, 0.42, 0], roll: cam.r });
    set.object(1, { screen: { glow: 0.06 + wake.v * 0.94 } });
    set.object(2, { yaw: -0.62 + Math.sin(t * 0.35) * 0.07, pitch: -0.26 + Math.sin(t * 0.27) * 0.04 });
    set.draw(t);
  });

  // Texto: llega con la primera frase, no con un fundido de todo junto.
  tl.fromTo('#rule', { width: 0 }, { width: 300, duration: 0.55, ease: 'power3.out' }, 0.15);
  tl.fromTo('#kicker', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.3);
  tl.fromTo('#head', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' }, 0.5);
  tl.fromTo('#sub', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, 1.6);
  tl.fromTo('#foot', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 2.5);
</script>
</body>
</html>
